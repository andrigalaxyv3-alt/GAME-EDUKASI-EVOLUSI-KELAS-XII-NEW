<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Evolution Adventure Pro - Andri Purnama, S.Pd.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
            user-select: none;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #game-container {
            position: relative;
            width: 1200px;
            height: 540px;
            background: #050b1a;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transition: transform 0.2s ease-out;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* Portrait Warning */
        #rotate-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #0a192f;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        @media (orientation: portrait) {
            #rotate-warning { display: flex; }
        }

        .ui-panel {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }

        .btn-game {
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 12px;
            pointer-events: auto;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-game:hover {
            background: #fff;
            color: #000;
        }

        #mobile-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            pointer-events: none;
            z-index: 200;
        }

        .control-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(5px);
            user-select: none;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.9);
        }

        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a2a3a;
            padding: 30px;
            border: 4px solid #f1c40f;
            z-index: 300;
            width: 85%;
            max-width: 500px;
            text-align: center;
        }

        .quiz-option {
            display: block;
            width: 100%;
            margin: 12px 0;
            background: #2c3e50;
            padding: 18px;
            font-size: 11px;
            border: 2px solid #34495e;
            cursor: pointer;
            color: white;
            font-family: 'Press Start 2P', cursive;
        }

        #overlay-start, #overlay-credit {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #0a192f 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 400;
        }

        /* Animasi Rotasi Icon */
        .rotate-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: rotateDevice 2s infinite alternate;
        }

        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="#f1c40f" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" />
            <path d="M12 18h.01" />
        </svg>
        <h2 class="text-yellow-400 text-sm">PUTAR PERANGKAT ANDA</h2>
        <p class="text-[10px] mt-4 text-gray-400">Gunakan mode lanskap untuk bermain</p>
    </div>

    <div id="game-wrapper">
        <div id="game-container">
            <!-- Overlay Start -->
            <div id="overlay-start">
                <h1 class="mb-4 text-yellow-400 text-2xl">EVOLUTION ADVENTURE</h1>
                <p class="mb-8 text-gray-400 text-[10px]">Karya: Andri Purnama, S.Pd.</p>
                <button onclick="startGame()" class="btn-game px-10 py-5 text-sm">MULAI EVOLUSI</button>
            </div>

            <!-- Overlay Credit -->
            <div id="overlay-credit" style="display: none;">
                <h1 class="text-green-400 mb-4 uppercase text-center px-4">SELAMAT! ANDA TELAH MENJADI MANUSIA SEMPURNA</h1>
                <p id="final-feedback" class="mb-8 text-[10px] text-gray-300"></p>
                <button onclick="location.reload()" class="btn-game px-6 py-3">MAIN LAGI</button>
            </div>

            <!-- UI Panels -->
            <div class="ui-panel">
                <div id="stats" class="text-[10px] leading-relaxed">
                    <span class="text-gray-400">TAHAP:</span> <span id="stage-name" class="text-yellow-400">AMOEBA</span><br>
                    <span class="text-gray-400">DNA:</span> <span id="score-val">0</span>
                </div>
                <div class="flex gap-2 pointer-events-auto">
                    <button onclick="toggleFullscreen()" id="fs-btn" class="btn-game">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 3h6v6M9 21H3v-6M21 15v6h-6M3 9V3h6"/></svg>
                        FS
                    </button>
                    <button onclick="toggleMusic()" id="music-btn" class="btn-game">MUSIC: OFF</button>
                    <button onclick="showExitModal()" class="btn-game" style="border-color: #e74c3c; color: #e74c3c;">EXIT</button>
                </div>
            </div>

            <canvas id="gameCanvas"></canvas>

            <!-- Mobile Controls -->
            <div id="mobile-controls">
                <div class="control-group">
                    <div id="btn-left" class="touch-btn">←</div>
                    <div id="btn-right" class="touch-btn">→</div>
                </div>
                <div class="control-group">
                    <div id="btn-jump" class="touch-btn">LOMPAT</div>
                </div>
            </div>

            <!-- Modals -->
            <div id="quiz-modal" class="modal">
                <h2 id="quiz-title" class="text-yellow-400 mb-4 text-[12px]">CEK PEMAHAMAN</h2>
                <p id="quiz-question" class="mb-6 text-[10px] leading-relaxed"></p>
                <div id="quiz-options"></div>
            </div>

            <div id="exit-modal" class="modal">
                <h2 class="text-red-500 mb-6 text-[14px]">PAUSE / EXIT</h2>
                <button onclick="location.reload()" class="quiz-option">MENU UTAMA</button>
                <button onclick="closeExitModal()" class="quiz-option" style="border-color: #27ae60;">LANJUTKAN</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score-val');
        const stageEl = document.getElementById('stage-name');
        const quizModal = document.getElementById('quiz-modal');
        const exitModal = document.getElementById('exit-modal');
        const bgMusic = document.getElementById('bg-music');

        const GAME_WIDTH = 1200;
        const GAME_HEIGHT = 540;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // Fullscreen Logic
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
            // Trigger resize after small delay to let browser settle
            setTimeout(resizeGame, 100);
        }

        // Auto-scaling logic
        function resizeGame() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scale = Math.min(windowWidth / GAME_WIDTH, windowHeight / GAME_HEIGHT);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);
        window.addEventListener('load', resizeGame);

        // Game State & Constants
        const GRAVITY = 0.5;
        const JUMP_FORCE = -12;
        const SPEED = 6;
        let score = 0;
        let gameActive = false;
        let quizActive = false;
        let isPaused = false;
        let cameraX = 0;
        let frameCount = 0;
        let lastCheckpointX = 100;
        let currentStageIdx = 0;

        const STAGES = [
            { name: "AMOEBA", scale: 0.8, color: "#9b59b2", secondary: "#8e44ad" },
            { name: "IKAN", scale: 1.0, color: "#3498db", secondary: "#2980b9" },
            { name: "KOMODO", scale: 1.1, color: "#27ae60", secondary: "#1e8449" },
            { name: "ORANGUTAN", scale: 1.2, color: "#d35400", secondary: "#a04000" },
            { name: "MANUSIA", scale: 1.3, color: "#f39c12", secondary: "#d68910" }
        ];

        const player = {
            x: 100, y: 300, width: 40, height: 40,
            velX: 0, velY: 0, grounded: false, jumpCount: 0, dir: 1, rotation: 0
        };

        const keys = {};
        window.addEventListener('keydown', e => {
            if ((e.code === 'ArrowUp' || e.code === 'Space') && gameActive && !quizActive) handleJump();
            keys[e.code] = true;
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function handleJump() {
            if (player.grounded) {
                player.velY = JUMP_FORCE;
                player.grounded = false;
                player.jumpCount = 1;
            } else if (player.jumpCount < 2) {
                player.velY = JUMP_FORCE * 0.85;
                player.jumpCount = 2;
            }
        }

        // Mobile Controls Listeners
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');
        
        const setKey = (k, v) => { keys[k] = v; };
        btnLeft.ontouchstart = (e) => { e.preventDefault(); setKey('ArrowLeft', true); };
        btnLeft.ontouchend = () => setKey('ArrowLeft', false);
        btnRight.ontouchstart = (e) => { e.preventDefault(); setKey('ArrowRight', true); };
        btnRight.ontouchend = () => setKey('ArrowRight', false);
        btnJump.ontouchstart = (e) => { e.preventDefault(); if (gameActive && !quizActive) handleJump(); };

        const questions = [
            { q: "Apa faktor utama seleksi alam menurut Darwin?", a: ["Mutasi Buatan", "Lingkungan", "Keinginan Individu", "Teknologi"], correct: 1 },
            { q: "Persamaan p^2 + 2pq + q^2 digunakan untuk populasi yang...", a: ["Punah", "Mutasi Tinggi", "Setimbang (Hardy-Weinberg)", "Terisolasi"], correct: 2 },
            { q: "Sayap burung dan tangan manusia adalah contoh...", a: ["Homologi", "Analogi", "Vestigial", "Fosil"], correct: 0 },
            { q: "Evolusi adalah proses perubahan yang berlangsung secara...", a: ["Instan", "Cepat", "Bertahap & Lama", "Tidak Terjadi"], correct: 2 },
            { q: "Apakah Anda siap menjadi manusia cerdas?", a: ["SIAP!", "BELUM"], correct: 0, isFinal: true }
        ];

        const platforms = [
            {x: 0, y: 480, w: 6000, h: 60},
            {x: 400, y: 350, w: 200, h: 20},
            {x: 750, y: 300, w: 200, h: 20},
            {x: 1100, y: 250, w: 250, h: 20},
            {x: 1500, y: 380, w: 300, h: 20},
            {x: 2000, y: 300, w: 200, h: 20},
            {x: 2400, y: 400, w: 500, h: 20},
            {x: 3200, y: 320, w: 250, h: 20},
            {x: 3600, y: 400, w: 400, h: 20},
            {x: 4200, y: 350, w: 300, h: 20},
            {x: 4800, y: 300, w: 300, h: 20},
            {x: 5400, y: 400, w: 600, h: 20}
        ];

        let dnas = [];
        for(let i=0; i<60; i++) {
            dnas.push({ x: 350 + (i*110), y: 150 + Math.sin(i*0.8)*140, collected: false });
        }

        const gates = [
            {x: 950, y: 300, solved: false, qIdx: 0},
            {x: 1950, y: 220, solved: false, qIdx: 1},
            {x: 3050, y: 220, solved: false, qIdx: 2},
            {x: 4100, y: 270, solved: false, qIdx: 3},
            {x: 5500, y: 320, solved: false, qIdx: 4}
        ];

        function drawWorld() {
            const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            grad.addColorStop(0, "#050b1a"); grad.addColorStop(1, "#1a2a3a");
            ctx.fillStyle = grad; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            platforms.forEach(p => {
                ctx.fillStyle = "#2c1e14"; ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                ctx.fillStyle = "#2e7d32"; ctx.fillRect(p.x - cameraX, p.y, p.w, 8);
            });

            dnas.forEach(d => {
                if (!d.collected) {
                    ctx.save(); ctx.fillStyle = "#f1c40f"; ctx.shadowBlur = 15; ctx.shadowColor = "#f1c40f";
                    ctx.beginPath(); ctx.arc(d.x - cameraX, d.y + Math.sin(frameCount*0.1)*5, 6, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                }
            });

            gates.forEach(g => {
                if (!g.solved) {
                    const py = g.y + Math.sin(frameCount*0.05)*10;
                    ctx.save();
                    ctx.shadowBlur = 20 + Math.sin(frameCount*0.1)*10; ctx.shadowColor = "#f39c12";
                    ctx.strokeStyle = "#f39c12"; ctx.lineWidth = 4;
                    ctx.setLineDash([10, 5]); ctx.lineDashOffset = -frameCount;
                    ctx.strokeRect(g.x - cameraX - 5, py - 5, 70, 70);
                    ctx.setLineDash([]); ctx.fillStyle = "#f39c12";
                    ctx.beginPath(); ctx.roundRect(g.x - cameraX + 5, py + 5, 50, 50, 8); ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.font = "bold 30px Arial"; ctx.textAlign = "center";
                    ctx.fillText("?", g.x - cameraX + 30, py + 42);
                    ctx.restore();
                }
            });
        }

        function drawPlayer() {
            const s = STAGES[currentStageIdx];
            const px = player.x - cameraX;
            const py = player.y;
            const w = player.width * s.scale;
            const h = player.height * s.scale;

            ctx.save();
            ctx.translate(px + w/2, py + h/2);
            if (player.dir === -1) ctx.scale(-1, 1);
            
            ctx.fillStyle = s.color;
            ctx.strokeStyle = s.secondary;
            ctx.lineWidth = 2;

            if (s.name === "AMOEBA") {
                ctx.beginPath();
                for(let i=0; i<12; i++) {
                    const r = (w/2) + Math.sin(frameCount*0.1 + i)*5;
                    const a = (i/12)*Math.PI*2;
                    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
                }
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (s.name === "IKAN") {
                ctx.beginPath(); ctx.ellipse(0, 0, w/2+8, h/3, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = s.secondary;
                ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.lineTo(-w/2-25, -15); ctx.lineTo(-w/2-25, 15); ctx.fill();
            } else if (s.name === "MANUSIA") {
                const walkM = player.grounded && Math.abs(player.velX) > 0 ? Math.sin(frameCount*0.15) * 15 : 0;
                ctx.fillStyle = "#ffcc80"; ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.strokeStyle = "#ffcc80";
                ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-10, 40 + walkM); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(10, 40 - walkM); ctx.stroke();
                ctx.fillStyle = "#3498db"; ctx.beginPath(); ctx.roundRect(-15, -50, 30, 55, 5); ctx.fill();
                ctx.fillStyle = "#ffcc80"; ctx.beginPath(); ctx.arc(0, -70, 18, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 8); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        }

        function update() {
            if (!gameActive || quizActive || isPaused) return;
            frameCount++;
            if (keys['ArrowRight']) { player.velX = SPEED; player.dir = 1; }
            else if (keys['ArrowLeft']) { player.velX = -SPEED; player.dir = -1; }
            else player.velX *= 0.85;

            player.velY += GRAVITY; player.x += player.velX; player.y += player.velY;
            cameraX += (player.x - 300 - cameraX) * 0.08;
            if (cameraX < 0) cameraX = 0;

            player.grounded = false;
            platforms.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.width > p.x &&
                    player.y < p.y + p.h && player.y + player.height > p.y) {
                    if (player.velY > 0 && player.y + player.height < p.y + 20) {
                        player.y = p.y - player.height; player.velY = 0; player.grounded = true; player.jumpCount = 0;
                    }
                }
            });

            dnas.forEach(d => {
                if (!d.collected && Math.abs(player.x-d.x)<40 && Math.abs(player.y-d.y)<40) {
                    d.collected = true; score += 25; scoreEl.innerText = score;
                }
            });

            gates.forEach(g => {
                if (!g.solved && Math.abs(player.x-g.x)<50 && Math.abs(player.y-g.y)<100) openQuiz(g);
            });

            if (player.y > GAME_HEIGHT) { player.x = lastCheckpointX; player.y = 300; player.velY = 0; }
        }

        function openQuiz(gate) {
            quizActive = true;
            const q = questions[gate.qIdx];
            document.getElementById('quiz-question').innerText = q.q;
            const box = document.getElementById('quiz-options');
            box.innerHTML = '';
            q.a.forEach((opt, idx) => {
                const b = document.createElement('button'); b.className = 'quiz-option'; b.innerText = opt;
                b.onclick = () => {
                    if (q.isFinal) { gate.solved = true; finishGame(); quizActive = false; quizModal.style.display = 'none'; }
                    else if (idx === q.correct) { 
                        gate.solved = true; lastCheckpointX = gate.x; evolve(); 
                        quizActive = false; quizModal.style.display = 'none'; 
                    } else { player.x -= 150; quizActive = false; quizModal.style.display = 'none'; }
                };
                box.appendChild(b);
            });
            quizModal.style.display = 'block';
        }

        function evolve() {
            if (currentStageIdx < STAGES.length - 1) {
                currentStageIdx++; stageEl.innerText = STAGES[currentStageIdx].name;
                score += 500; scoreEl.innerText = score;
            }
        }

        function startGame() { 
            document.getElementById('overlay-start').style.display = 'none'; 
            gameActive = true; resizeGame(); loop(); 
        }

        function showExitModal() { isPaused = true; exitModal.style.display = 'block'; }
        function closeExitModal() { isPaused = false; exitModal.style.display = 'none'; loop(); }

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('music-btn').innerText = "MUSIC: ON"; }
            else { bgMusic.pause(); document.getElementById('music-btn').innerText = "MUSIC: OFF"; }
        }

        function finishGame() {
            gameActive = false;
            document.getElementById('overlay-credit').style.display = 'flex';
        }

        function loop() {
            if (!gameActive || isPaused) return;
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            drawWorld(); drawPlayer(); update();
            requestAnimationFrame(loop);
        }

        // Initialize resize on start
        resizeGame();
    </script>
</body>
</html>
